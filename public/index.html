<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cifra Prebelli</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main id="app">
    <section id="lista" class="view">
      <header class="app-header">
        <h1>Cifra Prebelli</h1>
        <div class="header-actions">
          <input id="busca" type="search" placeholder="Buscar música ou artista…">
          <div id="filtro-estilos" class="multiselect"></div>
          <button id="btn-adicionar" class="btn primary">Adicionar</button>
          <button id="btn-tema" class="btn" title="Alternar tema">Tema</button>
        </div>
      </header>
      <div class="content-area">
        <p id="lista-vazia" class="placeholder"></p>
        <ul id="lista-musicas"></ul>
      </div>
    </section>
    <section id="show" class="view" hidden>
      <header class="app-header show-header">
        <button id="show-voltar" class="btn" title="Voltar para a lista">← Lista</button>
        <span id="show-titulo" class="show-titulo">Modo show</span>
        <div class="header-actions show-controles">
          <span class="ctl">
            <button id="btn-tom-menos" class="btn ctl" title="Diminuir tom">−</button>
            <span id="show-tom" class="ctl-valor" title="Tom atual">–</span>
            <button id="btn-tom-mais" class="btn ctl" title="Aumentar tom">+</button>
          </span>
          <button id="btn-proxima" class="btn primary" hidden>Próxima ▸</button>
        </div>
      </header>
      <div id="show-tela" class="show-tela">
        <button id="btn-proximo-bloco" class="btn proximo-bloco" title="Próximo bloco">Próximo ▾</button>
        <div id="show-cifra" class="show-cifra">
          <p class="placeholder" style="padding:1.25rem;">Toque numa música para começar.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="editor" class="editor" hidden>
    <div class="editor-panel">
      <h2 id="editor-titulo">Adicionar música</h2>
      <div class="editor-campos">
        <input id="ed-artista" type="text" placeholder="Artista">
        <input id="ed-titulo" type="text" placeholder="Título">
        <input id="ed-tom" type="text" placeholder="Tom" title="Tom da cifra (ex.: D, Bb)" maxlength="3">
        <select id="ed-capo" title="Capotraste: casa onde o capotraste é preso, ou Sem capo">
          <option value="0">Sem capo</option>
          <option value="1">1ª</option>
          <option value="2">2ª</option>
          <option value="3">3ª</option>
          <option value="4">4ª</option>
          <option value="5">5ª</option>
          <option value="6">6ª</option>
          <option value="7">7ª</option>
        </select>
        <div id="ed-estilos-wrap"></div>
      </div>
      <textarea id="ed-texto" placeholder="Cole ou escreva a cifra aqui… (ou arraste um arquivo .txt)"></textarea>
      <input id="ed-arquivo" type="file" accept=".txt,text/plain" hidden>
      <p id="editor-status" class="editor-status"></p>
      <div class="editor-acoes">
        <button id="btn-arquivo" class="btn">Abrir arquivo</button>
        <button id="btn-cancelar" class="btn">Cancelar</button>
        <button id="btn-salvar" class="btn primary">Salvar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
